<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="worldciv">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f3dfa2"/>
      <stop offset="0.45" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#7d5f2a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a72"/>
      <stop offset="0.55" stop-color="#123b5c"/>
      <stop offset="1" stop-color="#0a2136"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.34" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#3a7fa3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0a2136" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hex">
      <polygon points="256,30 452,143 452,369 256,482 60,369 60,143"/>
    </clipPath>
    <clipPath id="globe">
      <circle cx="256" cy="268" r="132"/>
    </clipPath>
  </defs>

  <!-- hex badge -->
  <polygon points="256,14 466,135 466,377 256,498 46,377 46,135" fill="url(#gold)"/>
  <polygon points="256,30 452,143 452,369 256,482 60,369 60,143" fill="#120d06"/>

  <g clip-path="url(#hex)">
    <rect x="40" y="20" width="432" height="472" fill="url(#sea)"/>
    <circle cx="256" cy="268" r="170" fill="url(#glow)"/>

    <!-- graticule -->
    <g clip-path="url(#globe)" stroke="#2f6f92" fill="none">
      <ellipse cx="256" cy="268" rx="132" ry="54" stroke-width="2.6"/>
      <ellipse cx="256" cy="268" rx="132" ry="101" stroke-width="1.8"/>
      <ellipse cx="256" cy="268" rx="95" ry="132" stroke-width="2.6"/>
      <ellipse cx="256" cy="268" rx="42" ry="132" stroke-width="1.8"/>
      <line x1="124" y1="268" x2="388" y2="268" stroke-width="2.6"/>
    </g>

    <!-- continents -->
    <g clip-path="url(#globe)" fill="#5f8f3f" stroke="#8fbf5f" stroke-width="2" stroke-linejoin="round">
      <!-- North America -->
      <path d="M162 214 L186 190 L216 184 L234 194 L226 208 L232 220 L216 230 L206 246 L188 242 L180 228 L164 224 Z"/>
      <!-- Greenland -->
      <path d="M240 178 L258 174 L264 184 L252 192 Z"/>
      <!-- South America -->
      <path d="M236 296 L258 292 L268 304 L262 320 L256 340 L250 360 L242 376 L236 358 L240 336 L234 316 Z"/>
      <!-- Europe -->
      <path d="M282 202 L300 194 L316 198 L320 208 L308 216 L292 216 L282 210 Z"/>
      <!-- Africa -->
      <path d="M290 224 L312 216 L330 226 L334 244 L324 260 L318 280 L308 298 L296 288 L292 268 L284 250 L286 234 Z"/>
      <!-- Asia -->
      <path d="M318 192 L346 182 L374 186 L390 200 L384 216 L368 222 L358 236 L344 232 L334 218 L322 210 Z"/>
      <!-- India -->
      <path d="M346 240 L358 236 L362 250 L354 262 L346 254 Z"/>
      <!-- Southeast Asia -->
      <path d="M374 244 L388 240 L394 250 L386 260 L376 256 Z"/>
      <!-- Australia -->
      <path d="M356 334 L376 330 L392 338 L390 352 L376 360 L358 354 Z"/>
      <!-- Antarctica hint -->
      <path d="M168 392 Q256 380 344 392 L342 398 Q256 386 170 400 Z" opacity="0.45"/>
    </g>

    <!-- rim -->
    <circle cx="256" cy="268" r="132" fill="none" stroke="#c9a45c" stroke-width="4.5"/>
  </g>

  <!-- star above the globe -->
  <path d="M256 76l7.4 16.5 18 1.9-13.5 12.1 3.7 17.8L256 115.7l-15.6 8.6 3.7-17.8-13.5-12.1 18-1.9Z"
        fill="#f6e7bf" stroke="#8a6a2f" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
